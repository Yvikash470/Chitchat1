name: Build Chit Chat Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required source and assets
        shell: bash
        run: |
          test -f App.js
          test -f package.json
          test -f app.json
          test -f eas.json
          test -f assets/chitchat-icon.png
          test -f assets/chitchat-foreground.png
          echo "Required Chit Chat source files and app icons are present."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run source and configuration preflight
        run: npm run check

      - name: Check Expo project
        run: npx expo-doctor

      - name: Verify Expo authentication secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN. Add an Expo access token under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download latest APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:download --platform android --latest --path ./ChitChat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChitChat-Android-APK
          path: ./ChitChat.apk
          if-no-files-found: error
