name: Build Chit Chat Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check Expo project
        run: npx expo-doctor

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download latest APK
        run: eas build:download --platform android --latest --path ./ChitChat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChitChat-Android-APK
          path: ./ChitChat.apk
          if-no-files-found: error
